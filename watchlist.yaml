# Steph's jobs watchlist — real job sources, grouped by category.
#
# Each active entry declares a `platform` (see adapters.py) plus the params that
# adapter needs. Adapters pull REAL structured vacancies (title, location, apply
# URL) from the ATS each employer actually uses — no keyword-guessing on page text.
#
#   workday          -> tenant, site, wd            (Sky, Disney, WBD, Sony, Banijay)
#   smartrecruiters  -> company                     (NBCUniversal)
#   netflix          -> (Eightfold; London-filtered)
#   amazon           -> base_query                  (amazon.jobs, London/GBR)
#   oracle           -> host                        (ITV — Oracle Recruiting Cloud)
#   bamboohr         -> subdomain                   (United Agents)
#   html             -> url, selector[, title_from_slug]  (Cineflix)
#   grapevine        -> pages                       (UK media aggregator)
#
# `aggregators` cover the indie/broadcaster long-tail that has no feed of its own.
# `no_feed` lists employers with no machine-readable vacancies (JS/CSRF-gated ATS,
# mailto, or LinkedIn-only). They are NOT scraped — their London roles surface via
# the Grapevine aggregator. Set a native email alert for any you want directly.

commissioning:
  # Workday: filter by UK country/location facet (not searchText="London"), which
  # captures UK sites whose text lacks "London" (Leavesden, Uxbridge, Iver Heath)
  # and drops cross-border noise. uk_scoped => skip the location gate downstream.
  - name: Sky
    platform: workday
    uk_scoped: true
    params:
      tenant: sky
      site: sky_careers
      wd: 3
      applied_facets: {locationCountry: ["29247e57dbaf46fb855b224e03170bc7"]}
  - name: Disney / Disney+ EMEA   # city-id union (no country facet); pulls in ILM London + Pinewood
    platform: workday
    uk_scoped: true
    params:
      tenant: disney
      site: disneycareer
      wd: 5
      applied_facets:
        locations: ["4f84d9e8a09701011a5fb8d739280000", "4f84d9e8a09701011a71a5bf87a70000"]
  - name: Warner Bros. Discovery
    platform: workday
    uk_scoped: true
    params:
      tenant: warnerbros
      site: global
      wd: 5
      applied_facets: {locationCountry: ["29247e57dbaf46fb855b224e03170bc7"]}

development:
  - name: Amazon MGM Studios (UK)
    platform: amazon
    params: {base_query: creative executive}
  - name: Banijay UK (Endemol Shine)
    platform: workday
    params: {tenant: endemolshine, site: EndemolShine_UK_Jobs, wd: 3}

acquisitions:
  - name: Netflix UK
    platform: netflix
    params: {}
  - name: Prime Video (Amazon)
    platform: amazon
    params: {base_query: content acquisition}
  - name: ITV
    platform: oracle
    params: {host: "https://fa-euup-saasfaprod1.fa.ocs.oraclecloud.com"}

international_sales:
  - name: Sony Pictures Television
    platform: workday
    params: {tenant: spe, site: SonyPicturesEntertainment, wd: 1}
  - name: NBCUniversal
    platform: smartrecruiters
    params: {company: NBCUniversal3}
  - name: Cineflix
    platform: html
    params:
      url: "https://cineflix.com/work-with-us/"
      selector: 'a[href*="/careers/"]'
      title_from_slug: true

talent_management:
  - name: United Agents
    platform: bamboohr
    params: {subdomain: unitedagents}

aggregators:
  - name: Grapevine Jobs (UK media — indies + broadcasters)
    platform: grapevine
    params: {records: 100}
  # Keyword job-search APIs — surface target roles across the whole market,
  # including indies with no ATS. Adzuna needs free keys (GitHub secrets
  # ADZUNA_APP_ID / ADZUNA_APP_KEY) and skips gracefully until they're set.
  # Careerjet needs a partner affid (env CAREERJET_AFFID). Queries reuse the
  # watch's vocabulary; results are still filtered by INCLUDE/EXCLUDE + UK gate.
  - name: Adzuna (UK job search)
    platform: adzuna
    params:
      queries: ["television commissioning", "content acquisitions",
                "development producer television", "tv distribution sales",
                "head of unscripted", "factual entertainment commissioner",
                "television publicist communications", "talent agent television"]
  - name: Careerjet (UK job search)
    platform: careerjet
    params:
      queries: ["television commissioning", "content acquisitions",
                "development producer television", "tv distribution sales",
                "head of unscripted", "television publicist"]

# ------------------------------------------------------------------------- #
# No machine-readable feed — covered via the Grapevine aggregator above, or
# set a native email alert. NOT scraped (would only ever return noise/nothing).
# ------------------------------------------------------------------------- #
no_feed:
  - {name: BBC, reason: "SuccessFactors search is JS-rendered — no server-side job list"}
  - {name: Channel 4, reason: "Salesforce fRecruit board is JS-rendered"}
  - {name: Paramount / Channel 5, reason: "SuccessFactors (viacomcbsi) — no public JSON API"}
  - {name: Apple TV+, reason: "jobs.apple.com serves no job results to datacenter IPs (headless returns only nav chrome)"}
  - {name: Fremantle, reason: "SuccessFactors board serves a nav-only shell to headless/datacenter access"}
  - {name: All3Media, reason: "no ATS; group roles surface on LinkedIn/Grapevine"}
  - {name: KEO Films, reason: "no careers page; hires via direct contact"}
  - {name: Expectation, reason: "no machine-readable careers page"}
  - {name: Love Productions, reason: "applications via mailto only"}
  - {name: 72 Films, reason: "no careers page"}
  - {name: Bad Wolf, reason: "no careers page"}
  - {name: Studio Lambert, reason: "recruits via parent All3Media / LinkedIn"}
  - {name: Left Bank Pictures, reason: "Sony-owned; nothing on own domain"}
  - {name: Passion Distribution, reason: "no careers page"}
  - {name: Hat Trick, reason: "no careers/vacancy page"}
  - {name: Keshet International, reason: "JS-rendered careers page — no feed"}
  - {name: Abacus Media Rights, reason: "TLS/cert issues — unreachable"}
  - {name: Premier PR, reason: "applications via mailto only"}
  - {name: Freuds, reason: "applications via mailto only"}
  - {name: DDA, reason: "site unreachable via automation"}
  - {name: YMU Group, reason: "no ATS widget or job feed"}
  - {name: Curtis Brown, reason: "API is a client-taxonomy, not vacancies"}
  - {name: Avalon, reason: "offloads vacancies to LinkedIn"}
  - {name: Off The Kerb, reason: "no careers page"}
  - {name: Insanity Group, reason: "no careers page"}
  - {name: Gleam Futures, reason: "no careers page"}
  - {name: The Talent Manager, reason: "login-gated even when rendered — needs credentials, not just a browser"}
  - {name: PMA vacancies board, reason: "member-gated ajax feed"}
