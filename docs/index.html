<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobs-watch — TV roles dashboard</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --ink: #1a1a1f; --muted: #6b6b76;
    --line: #e6e6ea; --accent: #d6336c; --live: #2f9e44; --alert: #e8a317;
    --chip: #f1f1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --card: #1f1f25; --ink: #ececf0; --muted: #9a9aa6;
      --line: #2c2c34; --accent: #f06595; --live: #51cf66; --alert: #ffd43b;
      --chip: #2a2a32;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 2rem 1.25rem 1.25rem; max-width: 960px; margin: 0 auto;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -.02em; }
  h1 .dot { color: var(--accent); }
  .sub { color: var(--muted); margin: 0; font-size: .95rem; }
  .stats { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0 0; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: .5rem .8rem; font-size: .85rem;
  }
  .stat b { font-size: 1.15rem; display: block; letter-spacing: -.02em; }
  main { max-width: 960px; margin: 0 auto; padding: 0 1.25rem 3rem; }
  .cat { margin-top: 1.75rem; }
  .cat > h2 {
    font-size: 1.05rem; text-transform: capitalize; margin: 0 0 .6rem;
    padding-bottom: .35rem; border-bottom: 1px solid var(--line);
  }
  .site {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: .85rem 1rem; margin-bottom: .6rem;
  }
  .site-head { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .site-head a { color: var(--ink); text-decoration: none; font-weight: 600; }
  .site-head a:hover { color: var(--accent); text-decoration: underline; }
  .badge {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
    padding: .1rem .45rem; border-radius: 999px; font-weight: 700;
  }
  .badge.html { background: color-mix(in srgb, var(--live) 18%, transparent); color: var(--live); }
  .badge.alert { background: color-mix(in srgb, var(--alert) 20%, transparent); color: var(--alert); }
  .count { color: var(--muted); font-size: .8rem; margin-left: auto; }
  ul.roles { list-style: none; margin: .6rem 0 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: .35rem; }
  ul.roles li {
    background: var(--chip); border-radius: 8px; padding: .2rem .55rem;
    font-size: .82rem; color: var(--ink);
  }
  .note { color: var(--muted); font-size: .82rem; margin: .5rem 0 0; }
  footer { max-width: 960px; margin: 0 auto; padding: 0 1.25rem 3rem;
    color: var(--muted); font-size: .8rem; }
  footer a { color: var(--accent); }
  .err { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>jobs<span class="dot">·</span>watch</h1>
  <p class="sub">A daily sweep of TV-industry careers pages. Live sites are scraped each weekday; alert sites need a native email signup.</p>
  <div class="stats" id="stats"></div>
</header>
<main id="app"><p class="note">Loading…</p></main>
<footer id="foot"></footer>

<script>
const CAP = s => s.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

fetch("./data.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById("app").innerHTML =
      `<p class="err">Couldn't load data.json (${esc(String(e.message))}). ` +
      `It's generated by the daily workflow — run it once from the Actions tab.</p>`;
  });

function render(d) {
  const t = d.totals;
  document.getElementById("stats").innerHTML = [
    [`${t.roles}`, "roles tracked"],
    [`${t.live}`, "live sites"],
    [`${t.alert}`, "alert sites"],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b>${l}</div>`).join("");

  document.getElementById("app").innerHTML = d.categories.map(cat => {
    const sites = cat.sites.map(s => {
      const cls = s.strategy === "html" ? "html" : "alert";
      const label = s.strategy === "html" ? "live" : "alert";
      const roles = (s.roles && s.roles.length)
        ? `<ul class="roles">${s.roles.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`
        : (s.strategy === "html"
            ? `<p class="note">No matching roles right now.</p>`
            : `<p class="note">JS-rendered or blocked — set a native email alert.</p>`);
      const count = s.strategy === "html"
        ? `<span class="count">${(s.roles || []).length} role(s)</span>` : "";
      return `<div class="site"><div class="site-head">` +
        `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` +
        `<span class="badge ${cls}">${label}</span>${count}</div>${roles}</div>`;
    }).join("");
    return `<section class="cat"><h2>${esc(CAP(cat.name))}</h2>${sites}</section>`;
  }).join("");

  document.getElementById("foot").innerHTML =
    `Baseline generated ${esc(d.generated)}. New roles arrive by email via GitHub issues; ` +
    `this page mirrors the current baseline. ` +
    `<a href="https://github.com/malexander-11/steph" target="_blank" rel="noopener">Source</a>.`;
}
</script>
</body>
</html>
